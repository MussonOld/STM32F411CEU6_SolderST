# CI: проверяет каждый push/PR в двух независимых джобах —
#   firmware-build — компилируется ли прошивка целиком (tools/ci-build.sh);
#   buttons-tests  — проходят ли хост-тесты драйвера кнопок (tests/buttons);
#   screen-golden  — не изменились ли обращения экрана к дисплею (tests/screen_golden);
#   menu-golden    — не изменилось ли поведение меню (tests/menu_golden);
#   sleep-golden   — не изменилось ли поведение таймеров сна (tests/sleep_golden);
#   buttons-golden — не изменилась ли классификация нажатий драйвера кнопок (tests/buttons_golden);
#   settings-golden — не изменилась ли загрузка/запись настроек (tests/settings_golden);
#   gfx-golden     — не изменился ли вывод текстового рендера (tests/gfx_golden);
#   control-golden — не изменился ли регулятор нагрева (tests/control_golden).
# Обе — быстрая проверка «не сломано ли», не замена ручной проверки на
# железе перед прошивкой.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware-build:
    name: Firmware build (arm-none-eabi-gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi

      - name: Build
        run: ./tools/ci-build.sh

  buttons-tests:
    name: Buttons host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: make -C tests/buttons

  screen-golden:
    name: Screen golden-master test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run golden test
        run: make -C tests/screen_golden check

  menu-golden:
    name: Menu golden-master test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run golden test
        run: make -C tests/menu_golden check

  sleep-golden:
    name: Sleep golden-master test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run golden test
        run: make -C tests/sleep_golden check

  buttons-golden:
    name: Buttons golden-master test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run golden test
        run: make -C tests/buttons_golden check

  settings-golden:
    name: Settings golden-master test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run golden test
        run: make -C tests/settings_golden check

  gfx-golden:
    name: Gfx golden-master test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run golden test
        run: make -C tests/gfx_golden check

  control-golden:
    name: Control golden-master test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run golden test
        run: make -C tests/control_golden check
